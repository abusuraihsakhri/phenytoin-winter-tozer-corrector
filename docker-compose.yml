version: '3.8'

services:
  phenytoin-winter-tozer-corrector:
    build: .
    container_name: phenytoin-winter-tozer-corrector
    ports:
      - "8000:8000"
    environment:
      - AUDIT_SECRET_KEY=phenytoin-winter-tozer-corrector-prod-audit-key-2026
      - MODEL_PROVIDER=mock
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 5s
      retries: 3
